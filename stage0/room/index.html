<!doctype html>
<!--
  Primer: the Home room, second go. A sketch to react to, not app code.
  A wide room that pans, a kitchen through the door, things that show they are fading,
  a bubble on touch, the globe display, and six avatar candidates.

    index.html                      the live sketch: drag sideways, tap things, tap the door, tap the globe
    index.html?nav=arrows           change rooms with edge arrows (also: doors, both)
    index.html?avatar=fox           who stands in the room: fox, capy, axo, tuft, glim, pebble
    index.html?card=fox&hat=1       one avatar by itself

  Modules and the map file need http, so serve this folder (any static server).
  tools/capture.mjs does that itself and writes shots/ and films/.
-->

</head>
