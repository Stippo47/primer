<!doctype html>
<!--
  Primer: the avatar, twelfth round. A sketch to react to, not app code. Stills only.

  1. Button with pill eyes: an upright 2D capsule, solid white, with Button's thin edge of light (the rim) and
     without it, plus one with a small dark pupil to compare against. Everything else is round 10's Button
     (js/crows.js, drawn by ../avatar10/js/crows.js).
  2. A style dial for two of the characters they liked, the gecko (round 4) and the cut-out person (round 5): one
     drawing each with a dial s from 0 (exactly as first drawn) to 1 (grown-up editorial flat vector), shown at five
     steps in the same pose (js/gecko.js, js/person.js, js/dial.js).

    index.html?pic=crow-button-pill-rim    one crow. ids: button-pill-rim, button-pill, button-pill-pupil
    index.html?lineup=crow-faces           the heads, large, with round 11's white-eyed Button first
    index.html?lineup=crow-icons           the same at icon size
    index.html?pic=gecko-3                 one step of the dial: gecko-1 ... gecko-5, person-1 ... person-5
    index.html?dial=person&s=0.6           any point on the dial

  Modules need http, and this page reaches into ../avatar10 and ../avatar11, so serve the stage0 folder.
  tools/capture.mjs does that itself and writes shots/.
-->
