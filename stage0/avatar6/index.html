<!doctype html>
<!--
  Primer: the avatar, sixth round. A sketch to react to, not app code.
  Stills only: no animation, no clothes, no accessories.

  The person, eight ways between and around the two shape styles picked last round, Blob and Noodle. The
  character and the face stay the same in all eight; only the way the body is built changes.
  And four new monsters, each drawn once in Blob and once in Noodle.

    index.html?set=person&id=blob            one picture. id: softer, blob, longer, blobnoodle, softnoodle,
                                             rounder, noodle, bendier
    index.html?set=monster&id=lamp-blob      one picture. id: lamp, flop, hug or wiggle, then -blob or -noodle
    index.html?set=person&lineup=1           the eight in a row at room size, numbered, one shared scale
    index.html?set=monster&lineup=1          the four monsters, Blob above Noodle, numbered, one shared scale
    add &room=1 to a lineup to draw it at 1x, the size it would be on the phone

  Modules need http, so serve this folder (any static server). tools/capture.mjs does that itself
  and writes shots/. The style rules are in ../avatar/STYLE-NOTES.md.
-->
